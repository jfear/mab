# cargo-deny configuration for Mab
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# Target platforms we support (see ADR-0001)
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Warn if a crate has been yanked from the registry
yanked = "warn"
# Explicitly ignored advisories can be listed here with their IDs
ignore = []

[licenses]
version = 2
# Permissive licenses we are comfortable depending on.
# Adjust this list if you add a dependency under a different license.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "CC0-1.0",
]
confidence-threshold = 0.8
# Don't warn about allowed licenses that no current dependency uses; the list is
# a pre-approved set, not a snapshot of the current dependency tree.
unused-allowed-license = "allow"
# License exceptions for specific crates go here
exceptions = []

[bans]
# Allow multiple versions of the same crate. Versions are managed at the
# workspace level, and duplicate versions pulled in by transitive deps
# (e.g. syn v2 and v3) are usually outside our control.
multiple-versions = "allow"
# Allow wildcard dependencies (workspace = true uses them internally).
wildcards = "allow"
# Highlight all duplicates, not just the first
highlight = "all"
# Allow default features from workspace crates
workspace-default-features = "allow"
# Allow default features from external crates
external-default-features = "allow"

[sources]
# Warn about unknown registries or git sources
unknown-registry = "warn"
unknown-git = "warn"
# Allowed git sources can be listed here
allow-git = []
