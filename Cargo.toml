[workspace]
members = ["crates/mab", "crates/mab-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Justin Fear <justin.m.fear@gmail.com>"]
edition = "2024"
homepage = "https://github.com/jfear/mab"
license = "MIT"
repository = "https://github.com/jfear/mab"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

mab-core = { path = "crates/mab-core" }

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
